name: Build amd64 VirtualBox smoke ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/amd64-virtualbox-smoke-iso.yml"
      - "images/amd64-test/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian ISO builder container
        run: docker build --platform linux/amd64 --tag galileo-linux-amd64-smoke-builder:ci --file images/amd64-test/Dockerfile .

      - name: Build and validate ISO
        run: docker run --rm --privileged --platform linux/amd64 --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace galileo-linux-amd64-smoke-builder:ci

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: galileo-linux-amd64-smoke-iso
          path: |
            dist/galileo-linux-amd64-smoke-*.iso
            dist/galileo-linux-amd64-smoke-*.iso.sha256
          if-no-files-found: error
